spring:
  application:
    name: baseback
  datasource:
    driverClassName: org.h2.Driver
    password: sa
    url: jdbc:h2:mem:dbtest
    username: sa
    h2:
      console:
        enabled: true
        path: /h2
        settings:
          web-allow-others: true
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
  sql:
    init:
      data-locations: classpath:db/data.sql
      platform: h2
      schema-locations: classpath:db/schema.sql
logging:
  level:
    root: debug
  file:
    path: D:/backback/logs
server:
  port: 8080

